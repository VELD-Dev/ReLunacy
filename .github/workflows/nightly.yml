# Mirrors VELD-Dev/Riftripper's nightly workflow: every push to `nightly` builds Windows + Linux
# artifacts and publishes/updates them under a single rolling "Nightly Builds" GitHub release
# (tag `nightly`, moved to the built commit on every run). Each run adds its artifacts next to the
# previous ones and the oldest are pruned, keeping the last KEEP_BUILDS per platform so a broken
# nightly can be rolled back - the running app's UpdateChecker (Nightly channel) picks the newest
# artifact for its platform out of that list.

name: Nightly Releases

on:
  push:
    branches: [ "nightly" ]

# Runs never overlap, so one run's prune can't delete what another is still uploading.
concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  KEEP_BUILDS: 10

jobs:
  # Creates the rolling `nightly` release once, before the builds start, so the parallel builds
  # below only ever update it - two parallel "create" calls on the very first run used to race and
  # one got a 422.
  release:
    name: Prepare Nightly Release

    # ncipollo/release-action needs write access to create/update the `nightly` release - without
    # this, it inherits the default GITHUB_TOKEN, which many repos/orgs now default to read-only,
    # and the create/update call fails with "403: Resource not accessible by integration".
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # The release action only sets the tag's commit when it creates it, so without this the tag
    # (and the release's "Source code" downloads) would stay on the very first nightly's commit.
    - name: Move nightly tag to this commit
      run: |
        git tag -f nightly "$GITHUB_SHA"
        git push -f origin refs/tags/nightly

    - name: Create or update release
      uses: ncipollo/release-action@v1.12.0
      with:
        name: Nightly Builds
        tag: 'nightly'
        allowUpdates: true
        draft: false
        omitBodyDuringUpdate: true
        omitDraftDuringUpdate: true
        omitNameDuringUpdate: true
        prerelease: true
        skipIfReleaseExists: false

  build:
    name: Nightly Builds (${{ matrix.kind }})
    needs: release

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        kind: ["WINDOWS", "WINDOWS ARM", "LINUX", "LINUX ARM"]
        include:
        - kind: WINDOWS
          os: windows-latest
          target: win-x64
        - kind: WINDOWS ARM
          os: windows-11-arm
          target: win-arm64
        - kind: LINUX
          os: ubuntu-latest
          target: linux-x64
        - kind: LINUX ARM
          os: ubuntu-24.04-arm
          target: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ReLunacy.sln

    - name: Stamp nightly build info
      shell: bash
      run: |
        commit_hash=$(git rev-parse --short "$GITHUB_SHA")
        build_date=$(date -u +'%Y-%m-%d')
        echo "commit_hash=$commit_hash" >> "$GITHUB_ENV"
        echo "build_date=$build_date" >> "$GITHUB_ENV"

        # NightlyBuildInfo.cs is checked in with both consts null (every other build) - this run
        # is the one place they get filled in, matching what UpdateChecker.CheckNightly extracts
        # back out of the artifact filename below to compare against.
        cat > ReLunacy/NightlyBuildInfo.cs <<EOF
        namespace ReLunacy;

        public static class NightlyBuildInfo
        {
            public const string? CommitHash = "$commit_hash";
            public const string? BuildDate = "$build_date";
        }
        EOF

    - name: Build
      shell: bash
      run: |
        release_name="ReLunacy-nightly-${{ env.build_date }}.${{ env.commit_hash }}.${{ matrix.target }}"
        echo "release_name=$release_name" >> "$GITHUB_ENV"

        dotnet build ReLunacy/ReLunacy.csproj -c Release -r "${{ matrix.target }}" --no-self-contained

        if [[ "${{ matrix.target }}" == win-* ]]; then
          # 7-Zip isn't guaranteed on the Windows ARM runner image; PowerShell's zip always is.
          if command -v 7z >/dev/null; then
            7z a -tzip "${release_name}.zip" "./ReLunacy/bin/Release/net10.0/${{ matrix.target }}/*"
          else
            pwsh -NoProfile -Command "Compress-Archive -Path './ReLunacy/bin/Release/net10.0/${{ matrix.target }}/*' -DestinationPath '${release_name}.zip'"
          fi
        else
          tar -czvf "${release_name}.tar.gz" -C "./ReLunacy/bin/Release/net10.0/${{ matrix.target }}" .
        fi

    - name: Publish
      uses: ncipollo/release-action@v1.12.0
      with:
        name: Nightly Builds
        tag: 'nightly'
        artifacts: ./ReLunacy-nightly-*
        allowUpdates: true
        draft: false
        omitBodyDuringUpdate: true
        omitDraftDuringUpdate: true
        omitNameDuringUpdate: true
        prerelease: true
        replacesArtifacts: false
        skipIfReleaseExists: false

  prune:
    name: Prune Old Nightly Builds
    needs: build
    # Also after a failed platform, so the others' uploads are still pruned.
    if: ${{ !cancelled() }}

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    - name: Keep the last ${{ env.KEEP_BUILDS }} builds per platform
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Asset names are ReLunacy-nightly-{date}.{commit}.{rid}.{ext}; group by rid and keep the
        # newest by upload time (the name only orders by date, then by commit hash).
        gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '
          .assets
          | map(select(.name | test("\\.(win|linux)-(x64|arm64)\\.")))
          | group_by(.name | capture("\\.(?<rid>(win|linux)-(x64|arm64))\\.").rid)
          | map(sort_by(.created_at) | reverse | .['"$KEEP_BUILDS"':])
          | flatten | .[] | "\(.id) \(.name)"' |
        while read -r id name; do
          echo "Deleting $name"
          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
        done
